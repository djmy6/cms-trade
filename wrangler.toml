name = "cms-trade"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# 运行环境变量（在 Pages 项目设置中配置 Secrets / Environment Variables）
# SECRET_KEY             JWT 签名密钥（必填，随机长字符串）
# SMS_PROVIDER           mock | aliyun | tencent（默认 mock=测试验证码）
# ALIYUN_ACCESS_KEY_ID   阿里云短信 AccessKeyId（SMS_PROVIDER=aliyun 时）
# ALIYUN_ACCESS_KEY_SECRET
# ALIYUN_SIGN_NAME       阿里云短信签名
# ALIYUN_TEMPLATE_CODE    阿里云短信模板CODE
# ALIYUN_REGION           默认 cn-hangzhou
# TENCENT_SECRET_ID       腾讯云短信 SecretId
# TENCENT_SECRET_KEY
# TENCENT_SDKAPPID        腾讯云短信 SDKAppID
# TENCENT_SIGN_NAME       腾讯云短信签名
# TENCENT_TEMPLATE_ID     腾讯云短信模板ID
# MOCK_CODE               mock 模式下的测试验证码（默认 123456）
[vars]
SMS_PROVIDER = "mock"
MOCK_CODE = "123456"
