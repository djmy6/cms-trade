<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M3 3h18v18H3z'/%3E%3Ctext x='6' y='18' font-size='15' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <span class="brand">交易记录 CMS</span>
  <a class="link" href="index.html">首页</a>
  <a class="link" href="publish.html">发布</a>
  <a class="link" href="admin.html">后台管理</a>
  <a class="link" href="settings.html">对外显示设置</a>
  <div class="spacer"></div>
  <span class="user-chip" id="nav-user"></span>
  <a class="link" href="#" id="nav-logout" style="display:none">退出</a>
</div></nav>

<div class="container">
  <h2 style="margin-bottom:14px">后台管理</h2>
  <div class="stat-grid" id="stats"></div>

  <div class="card">
    <h3 style="margin-bottom:12px">用户管理</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>手机号</th><th>昵称</th><th>角色</th><th>帖数</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody id="users-tbody"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">全部帖子</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>平台</th><th>店铺</th><th>买家账号</th><th>买家姓名</th><th>单号</th><th>金额</th><th>发布人</th><th>操作</th></tr></thead>
      <tbody id="posts-tbody"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">自定义字段管理（发布页动态显示）</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <input id="cf_label" placeholder="字段名称（如：退货原因）" style="flex:1;min-width:140px">
      <input id="cf_key" placeholder="字段标识（如：return_reason）" style="flex:1;min-width:150px">
      <select id="cf_type" style="width:110px"><option value="text">文本</option><option value="number">数字</option><option value="select">下拉</option><option value="textarea">多行</option></select>
      <input id="cf_options" placeholder="下拉选项（逗号分隔）" style="flex:1;min-width:180px">
      <button class="btn" id="btn-add-field">添加字段</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>名称</th><th>标识</th><th>类型</th><th>必填</th><th>启用</th><th>操作</th></tr></thead>
      <tbody id="fields-tbody"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px">论坛板块管理</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <input id="board_name" placeholder="板块名称（如：交易求助）" style="flex:1;min-width:180px">
      <input id="board_desc" placeholder="板块简介（可选）" style="flex:2;min-width:200px">
      <button class="btn" id="btn-add-board">添加板块</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>名称</th><th>简介</th><th>主题数</th></tr></thead>
      <tbody id="boards-tbody"></tbody>
    </table></div>
  </div>
</div>
<div id="toast"></div>
<script src="assets/api.js"></script>
<script>
function renderNav() {
  const u = Api.user;
  if (u) {
    document.getElementById('nav-user').textContent = u.name || u.phone;
    document.getElementById('nav-logout').style.display = '';
  }
}
document.getElementById('nav-logout').onclick = (e) => { e.preventDefault(); Api.logout(); location.href = 'login.html'; };

async function loadStats() {
  const { stats } = await Api.admin('stats');
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${esc(stats.users)}</div><div class="t">注册用户</div></div>
    <div class="stat"><div class="n">${esc(stats.posts)}</div><div class="t">帖子总数</div></div>
    <div class="stat"><div class="n">${esc(stats.admins)}</div><div class="t">管理员</div></div>
    <div class="stat"><div class="n">${esc(stats.refundAmount)}</div><div class="t">仅退款金额合计</div></div>`;
}

async function loadUsers() {
  const { list } = await Api.admin('users');
  document.getElementById('users-tbody').innerHTML = list.map((u) => `
    <tr>
      <td>${u.id}</td><td>${esc(u.phone)}</td><td>${esc(u.name || '-')}</td>
      <td>${u.role === 'admin' ? '管理员' : '用户'}</td><td>${u.post_count}</td><td>${esc(u.created_at)}</td>
      <td>
        ${u.role === 'admin'
          ? `<button class="btn-sm ghost" onclick="setRole(${u.id},'user')">取消管理员</button>`
          : `<button class="btn-sm" onclick="setRole(${u.id},'admin')">设为管理员</button>`}
        <button class="btn-sm danger" onclick="delUser(${u.id})">删除</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="7">暂无用户</td></tr>';
}

async function loadPosts() {
  const { list } = await Api.admin('posts');
  document.getElementById('posts-tbody').innerHTML = list.map((p) => `
    <tr>
      <td>${p.id}</td><td>${esc(p.platform || '-')}</td><td>${esc(p.shop_name || '-')}</td>
      <td>${esc(p.buyer_account || '-')}</td><td>${esc(p.buyer_name || '-')}</td>
      <td>${esc(p.tracking_no || '-')}</td><td>${esc(p.amount || '-')}</td>
      <td>${esc(p.author_name || p.author_phone || p.user_id)}</td>
      <td><button class="btn-sm danger" onclick="delPost(${p.id})">删除</button></td>
    </tr>`).join('') || '<tr><td colspan="9">暂无帖子</td></tr>';
}

async function setRole(id, role) {
  try { await Api.setRole(id, role); toast('已更新'); loadUsers(); } catch (e) { toast(e.message, false); }
}
async function delUser(id) {
  if (!confirm('确认删除该用户及其全部帖子？')) return;
  try { await Api.deleteUser(id); toast('已删除'); loadUsers(); loadPosts(); } catch (e) { toast(e.message, false); }
}
async function delPost(id) {
  if (!confirm('确认删除该帖子？')) return;
  try { await Api.deletePost(id); toast('已删除'); loadPosts(); } catch (e) { toast(e.message, false); }
}

async function loadFields() {
  const { list } = await Api.adminFields();
  document.getElementById('fields-tbody').innerHTML = list.map((f) => `
    <tr>
      <td>${esc(f.label)}</td><td>${esc(f.field_key)}</td><td>${esc(f.field_type)}</td>
      <td>${f.required ? '是' : '否'}</td>
      <td><button class="btn-sm ghost" onclick="toggleField(${f.id},${f.active ? 0 : 1})">${f.active ? '停用' : '启用'}</button></td>
      <td>
        <button class="btn-sm ghost" onclick="editField(${f.id})">编辑</button>
        <button class="btn-sm danger" onclick="deleteField(${f.id})">删除</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="6">暂无自定义字段，可在上方添加（发布页会动态显示）</td></tr>';
}
document.getElementById('btn-add-field').onclick = async () => {
  const label = document.getElementById('cf_label').value.trim();
  const key = document.getElementById('cf_key').value.trim();
  const type = document.getElementById('cf_type').value;
  const options = document.getElementById('cf_options').value.trim();
  if (!label || !key) return toast('请填写字段名称和标识', false);
  try {
    await Api.createField({ label, field_key: key, field_type: type, options, required: 0, sort_order: 0 });
    toast('字段已添加');
    ['cf_label', 'cf_key', 'cf_options'].forEach((i) => document.getElementById(i).value = '');
    loadFields();
  } catch (e) { toast(e.message, false); }
};
async function toggleField(id, active) {
  const { list } = await Api.adminFields();
  const f = list.find((x) => x.id === id);
  if (!f) return;
  try {
    await Api.updateField(id, { label: f.label, field_key: f.field_key, field_type: f.field_type, options: f.options, required: f.required, sort_order: f.sort_order, active });
    toast('已更新'); loadFields();
  } catch (e) { toast(e.message, false); }
}
async function editField(id) {
  const { list } = await Api.adminFields();
  const f = list.find((x) => x.id === id);
  if (!f) return;
  const label = prompt('字段名称', f.label); if (label === null) return;
  const type = prompt('类型(text/number/select/textarea)', f.field_type);
  const options = prompt('下拉选项（逗号分隔）', f.options);
  const required = confirm('该字段是否必填？') ? 1 : 0;
  try {
    await Api.updateField(id, { label, field_key: f.field_key, field_type: type, options, required, sort_order: f.sort_order, active: f.active });
    toast('已保存'); loadFields();
  } catch (e) { toast(e.message, false); }
}
async function deleteField(id) {
  if (!confirm('删除该字段？已填写的该字段内容将不再显示。')) return;
  try { await Api.deleteField(id); toast('已删除'); loadFields(); } catch (e) { toast(e.message, false); }
}

async function loadBoards() {
  const { list } = await Api.boards();
  document.getElementById('boards-tbody').innerHTML = list.map((b) => `
    <tr><td>${b.id}</td><td>${esc(b.name)}</td><td>${esc(b.description || '-')}</td><td>${b.topic_count}</td></tr>`).join('') || '<tr><td colspan="4">暂无板块，可在上方添加</td></tr>';
}
document.getElementById('btn-add-board').onclick = async () => {
  const name = document.getElementById('board_name').value.trim();
  const desc = document.getElementById('board_desc').value.trim();
  if (!name) return toast('请填写板块名称', false);
  try {
    await Api.createBoard({ name, description: desc });
    toast('板块已添加');
    document.getElementById('board_name').value = '';
    document.getElementById('board_desc').value = '';
    loadBoards();
  } catch (e) { toast(e.message, false); }
};

renderNav();
Promise.all([loadStats(), loadUsers(), loadPosts(), loadFields(), loadBoards()]).catch((e) => {
  if (e.message.includes('管理员')) toast('需要管理员权限', false);
  else if (e.message.includes('未登录')) location.href = 'login.html';
  else toast(e.message, false);
});
</script>
</body>
</html>
