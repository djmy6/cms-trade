<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布交易记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M3 3h18v18H3z'/%3E%3Ctext x='6' y='18' font-size='15' fill='%23fff'%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <span class="brand">交易记录 CMS</span>
  <a class="link" href="index.html">首页</a>
  <a class="link" href="publish.html" style="color:var(--primary);background:var(--primary-soft)">发布</a>
  <a class="link" id="nav-admin" href="admin.html" style="display:none">后台</a>
  <a class="link" href="settings.html">设置</a>
  <a class="link" href="forum.html">论坛</a>
  <div class="spacer"></div>
  <div class="nav-actions">
    <button class="icon-btn" id="theme-toggle" title="夜间/日间">🌓</button>
    <span class="user-chip" id="nav-user"></span>
    <a class="link" id="nav-login" href="login.html">登录</a>
    <a class="link" id="nav-logout" href="#" style="display:none">退出</a>
  </div>
</div></nav>

<div class="container">
  <div class="card">
    <h2 id="title" style="margin-bottom:16px">发布交易记录</h2>
    <div class="hint blue">带 <b style="color:var(--danger)">*</b> 的至少填一项。对外是否展示这些字段，可在「对外显示设置」中控制。</div>
    <div class="form-grid">
      <div class="form-group"><label>交易平台</label><input id="platform" placeholder="如：淘宝 / 拼多多"></div>
      <div class="form-group"><label>店铺名称</label><input id="shop_name" placeholder="店铺名"></div>
      <div class="form-group"><label>购买物品</label><input id="item" placeholder="购买物品名称"></div>
      <div class="form-group"><label>物品金额</label><input id="amount" placeholder="金额"></div>
      <div class="form-group"><label><b style="color:var(--danger)">*</b> 买家账号</label><input id="buyer_account" placeholder="买家账号"></div>
      <div class="form-group"><label>买家姓名</label><input id="buyer_name" placeholder="买家姓名"></div>
      <div class="form-group"><label>买家真实号码</label><input id="buyer_real_phone" placeholder="真实手机号"></div>
      <div class="form-group"><label>买家虚拟号码</label><input id="buyer_virtual_phone" placeholder="虚拟号码"></div>
      <div class="form-group" style="grid-column:1/-1"><label>买家地址（省 / 市 / 县区 / 乡镇街道）</label>
        <div class="addr-row">
          <select id="address_province"><option value="">请选择省</option></select>
          <select id="address_city" disabled><option value="">请选择市</option></select>
          <select id="address_district" disabled><option value="">请选择县/区</option></select>
          <select id="address_street" disabled><option value="">请选择乡镇/街道</option></select>
        </div>
      </div>
      <div class="form-group" style="grid-column:1/-1"><label>详细地址</label><input id="address_detail" placeholder="门牌号、小区、楼栋等（自行填写）"></div>
      <div class="form-group"><label>快递单号</label><input id="tracking_no" placeholder="快递单号"></div>
      <div class="form-group"><label>仅退款次数</label><input id="refund_count" type="number" min="0" placeholder="0"></div>
      <div class="form-group"><label>仅退款金额</label><input id="refund_amount" placeholder="金额"></div>
      <div id="custom-fields" style="grid-column:1/-1"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn" id="btn-save">保存发布</button>
      <button class="btn ghost" onclick="location.href='index.html'">返回</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="assets/api.js"></script>

<button class="back-top" id="back-top">↑</button>
<script>
function applyTheme(){ document.documentElement.classList.toggle('dark', localStorage.getItem('cms_theme') === 'dark'); }
applyTheme();
document.getElementById('theme-toggle').onclick = () => { const d = document.documentElement.classList.toggle('dark'); localStorage.setItem('cms_theme', d ? 'dark' : 'light'); };
const bt = document.getElementById('back-top');
window.addEventListener('scroll', () => bt.classList.toggle('show', window.scrollY > 300));
bt.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
</script>

<script src="assets/regions.js"></script>
<script>
if (!authRequired()) {}
const url = new URLSearchParams(location.search);
const editId = url.get('id');
const REG = window.REGIONS || [];
let CFIELDS = [];

function renderNav() {
  const u = Api.user;
  if (u) {
    document.getElementById('nav-user').textContent = u.name || u.phone;
    document.getElementById('nav-logout').style.display = '';
    if (u.role === 'admin') document.getElementById('nav-admin').style.display = '';
  }
}
document.getElementById('nav-logout').onclick = (e) => { e.preventDefault(); Api.logout(); location.href = 'login.html'; };

const IDS = ['platform','shop_name','item','amount','buyer_account','buyer_name','buyer_real_phone','buyer_virtual_phone','tracking_no','refund_count','refund_amount'];

function fillSel(el, items, ph) {
  el.innerHTML = '<option value="">' + ph + '</option>' +
    (items || []).map((x) => '<option value="' + esc(x.name) + '">' + esc(x.name) + '</option>').join('');
}
function bindAddr() {
  const p = document.getElementById('address_province');
  const c = document.getElementById('address_city');
  const d = document.getElementById('address_district');
  const s = document.getElementById('address_street');
  fillSel(p, REG, '请选择省');
  p.onchange = () => { const prov = REG.find((x) => x.name === p.value) || {}; fillSel(c, prov.children, '请选择市'); c.disabled = !p.value; fillSel(d, [], '请选择县/区'); d.disabled = !p.value; fillSel(s, [], '请选择乡镇/街道'); s.disabled = !p.value; };
  c.onchange = () => { const prov = REG.find((x) => x.name === p.value) || {}; const city = (prov.children || []).find((x) => x.name === c.value) || {}; fillSel(d, city.children, '请选择县/区'); d.disabled = !c.value; fillSel(s, [], '请选择乡镇/街道'); s.disabled = !c.value; };
  d.onchange = () => { const prov = REG.find((x) => x.name === p.value) || {}; const city = (prov.children || []).find((x) => x.name === c.value) || {}; const dist = (city.children || []).find((x) => x.name === d.value) || {}; fillSel(s, dist.children, '请选择乡镇/街道'); s.disabled = !d.value; };
}
function setAddr(pn, cn, dn, sn) {
  const p = document.getElementById('address_province');
  const c = document.getElementById('address_city');
  const d = document.getElementById('address_district');
  const s = document.getElementById('address_street');
  if (pn) { p.value = pn; p.onchange(); }
  if (cn) { c.value = cn; c.onchange(); }
  if (dn) { d.value = dn; d.onchange(); }
  if (sn) { s.value = sn; }
}

async function loadFields() {
  const r = await Api.fields();
  CFIELDS = r.list || [];
  const box = document.getElementById('custom-fields');
  box.innerHTML = '<div style="grid-column:1/-1"></div>'; // keep layout
  box.innerHTML = CFIELDS.map((f) => {
    const req = f.required ? '<b style="color:var(--danger)">*</b> ' : '';
    let input = '';
    if (f.field_type === 'select') input = '<select id="cf_' + f.field_key + '"><option value="">请选择</option>' + (f.options || '').split(',').map((o) => o.trim()).filter(Boolean).map((o) => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') + '</select>';
    else if (f.field_type === 'textarea') input = '<textarea id="cf_' + f.field_key + '" rows="2" placeholder="' + esc(f.label) + '"></textarea>';
    else if (f.field_type === 'number') input = '<input id="cf_' + f.field_key + '" type="number" placeholder="' + esc(f.label) + '">';
    else input = '<input id="cf_' + f.field_key + '" placeholder="' + esc(f.label) + '">';
    return '<div class="form-group"><label>' + req + esc(f.label) + '</label>' + input + '</div>';
  }).join('');
}

if (editId) {
  document.getElementById('title').textContent = '编辑交易记录';
  Api.getPost(editId).then((d) => {
    const post = d.post;
    for (const id of IDS) document.getElementById(id).value = post[id] || '';
    document.getElementById('address_detail').value = post.address_detail || '';
    setAddr(post.address_province, post.address_city, post.address_district, post.address_street);
    const extra = {};
    try { Object.assign(extra, JSON.parse(post.extra_fields || '{}')); } catch {}
    setTimeout(() => {
      for (const k of Object.keys(extra)) {
        const el = document.getElementById('cf_' + k);
        if (el) el.value = extra[k];
      }
    }, 50);
  }).catch((e) => toast(e.message, false));
}

document.getElementById('btn-save').onclick = async () => {
  const p = {};
  for (const id of IDS) p[id] = document.getElementById(id).value.trim();
  p.address_province = document.getElementById('address_province').value;
  p.address_city = document.getElementById('address_city').value;
  p.address_district = document.getElementById('address_district').value;
  p.address_street = document.getElementById('address_street').value;
  p.address_detail = document.getElementById('address_detail').value.trim();
  for (const f of CFIELDS) {
    const el = document.getElementById('cf_' + f.field_key);
    if (el) {
      const v = el.value.trim();
      if (f.required && !v) { toast('请填写「' + f.label + '」', false); return; }
      p['cf_' + f.field_key] = v;
    }
  }
  try {
    if (editId) { await Api.updatePost(editId, p); toast('已更新'); }
    else { await Api.createPost(p); toast('发布成功'); }
    setTimeout(() => location.href = 'index.html', 500);
  } catch (e) { toast(e.message, false); }
};

renderNav();
bindAddr();
loadFields().catch(() => {});
</script>
</body>
</html>
