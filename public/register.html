<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M3 3h18v18H3z'/%3E%3Ctext x='6' y='18' font-size='15' fill='%23fff'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <div class="auth-title"><h1>注册账号</h1><p>手机号接收验证码核验</p></div>
    <div class="hint blue" id="sms-hint" style="display:none"></div>
    <div class="form-group">
      <label>手机号</label>
      <input id="phone" placeholder="11 位手机号" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>验证码</label>
      <div class="code-row">
        <input id="code" placeholder="6 位验证码" inputmode="numeric">
        <button class="btn ghost" id="btn-code">获取验证码</button>
      </div>
    </div>
    <div class="form-group">
      <label>密码（至少 6 位）</label>
      <input id="password" type="password" placeholder="设置登录密码">
    </div>
    <div class="form-group">
      <label>昵称（可选）</label>
      <input id="name" placeholder="你的称呼">
    </div>
    <button class="btn block" id="btn-register">注 册</button>
    <p style="text-align:center;margin-top:14px;font-size:13px">已有账号？<a href="login.html">去登录</a></p>
  </div>
</div>
<div id="toast"></div>
<script src="assets/api.js"></script>
<script>
const btnCode = document.getElementById('btn-code');
let countdown = 0;

async function sendCode() {
  const phone = document.getElementById('phone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) return toast('请输入正确的手机号', false);
  try {
    const r = await Api.sendCode(phone, 'register');
    const hint = document.getElementById('sms-hint');
    if (r.mode === 'mock') {
      hint.style.display = '';
      hint.innerHTML = '当前为<strong>开发模式</strong>，未接入真实短信服务。<br>测试验证码：<strong>' + esc(r.devCode || r.msg) + '</strong>';
      document.getElementById('code').value = r.devCode || '';
    } else {
      hint.style.display = '';
      hint.innerHTML = '验证码已发送至 ' + esc(phone) + '，请查收短信';
    }
    toast('验证码已发送');
    countdown = 60;
    tick();
  } catch (e) { toast(e.message, false); }
}
function tick() {
  btnCode.disabled = countdown > 0;
  btnCode.textContent = countdown > 0 ? countdown + 's' : '获取验证码';
  if (countdown > 0) { countdown--; setTimeout(tick, 1000); }
}
btnCode.onclick = sendCode;

document.getElementById('btn-register').onclick = async () => {
  const phone = document.getElementById('phone').value.trim();
  const code = document.getElementById('code').value.trim();
  const password = document.getElementById('password').value;
  const name = document.getElementById('name').value.trim();
  try {
    const r = await Api.register({ phone, code, password, name });
    Api.setSession(r.token, r.user);
    toast('注册成功');
    setTimeout(() => location.href = 'index.html', 500);
  } catch (e) { toast(e.message, false); }
};
</script>
</body>
</html>
