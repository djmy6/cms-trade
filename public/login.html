<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M3 3h18v18H3z'/%3E%3Ctext x='6' y='18' font-size='15' fill='%23fff'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card">
    <div class="auth-title"><h1>登录</h1><p>使用手机号和密码登录</p></div>
    <div class="form-group">
      <label>手机号</label>
      <input id="phone" placeholder="11 位手机号" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input id="password" type="password" placeholder="登录密码">
    </div>
    <button class="btn block" id="btn-login">登 录</button>
    <p style="text-align:center;margin-top:14px;font-size:13px">还没有账号？<a href="register.html">去注册</a></p>
    <div class="hint blue" style="margin-top:16px">
      管理员入口：账号 <b>djmy</b> · 密码 <b>000000</b>（管理员登录后可进入后台管理）
      <button class="btn-sm ghost" id="btn-admin-fill" style="margin-left:6px">一键填入</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="assets/api.js"></script>
<script>
document.getElementById('btn-admin-fill').onclick = () => {
  document.getElementById('phone').value = 'djmy';
  document.getElementById('password').value = '000000';
};
document.getElementById('btn-login').onclick = async () => {
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  try {
    const r = await Api.login(phone, password);
    Api.setSession(r.token, r.user);
    toast('登录成功');
    setTimeout(() => location.href = 'index.html', 500);
  } catch (e) { toast(e.message, false); }
};
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('btn-login').click(); });
</script>
</body>
</html>
