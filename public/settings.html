<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对外显示设置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232563eb' d='M3 3h18v18H3z'/%3E%3Ctext x='6' y='18' font-size='15' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <span class="brand">交易记录 CMS</span>
  <a class="link" href="index.html">首页</a>
  <a class="link" href="publish.html">发布</a>
  <a class="link" id="nav-admin" href="admin.html" style="display:none">后台</a>
  <a class="link" href="settings.html" style="color:var(--primary);background:var(--primary-soft)">设置</a>
  <a class="link" href="forum.html">论坛</a>
  <div class="spacer"></div>
  <div class="nav-actions">
    <button class="icon-btn" id="theme-toggle" title="夜间/日间">🌓</button>
    <span class="user-chip" id="nav-user"></span>
    <a class="link" id="nav-login" href="login.html">登录</a>
    <a class="link" id="nav-logout" href="#" style="display:none">退出</a>
  </div>
</div></nav>

<div class="container">
  <div class="card" style="max-width:640px">
    <h2 style="margin-bottom:6px">对外显示设置</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">控制你发布的交易记录中，哪些字段对其他登录用户可见。买家真实号码、地址等敏感字段建议保持关闭。</p>
    <div class="hint blue">管理员始终可见全部字段（不受此设置影响）。</div>
    <div id="switches"></div>
    <div style="margin-top:16px">
      <button class="btn" id="btn-save">保存设置</button>
      <span id="saved" style="margin-left:12px;color:#16a34a;font-size:13px"></span>
    </div>

    <hr style="margin:24px 0;border:none;border-top:1px solid #eee">

    <h3 style="margin-bottom:6px">修改密码</h3>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">修改你的登录密码，下次登录使用新密码。</p>
    <div class="form-group">
      <label>当前密码</label>
      <input id="old-password" type="password" placeholder="输入当前密码">
    </div>
    <div class="form-group">
      <label>新密码（至少 6 位）</label>
      <input id="new-password" type="password" placeholder="输入新密码">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input id="confirm-password" type="password" placeholder="再次输入新密码">
    </div>
    <div style="margin-top:16px">
      <button class="btn" id="btn-change-password">修改密码</button>
      <span id="pwd-msg" style="margin-left:12px;font-size:13px"></span>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="assets/api.js"></script>

<button class="back-top" id="back-top">↑</button>
<script>
function applyTheme(){ document.documentElement.classList.toggle('dark', localStorage.getItem('cms_theme') === 'dark'); }
applyTheme();
document.getElementById('theme-toggle').onclick = () => { const d = document.documentElement.classList.toggle('dark'); localStorage.setItem('cms_theme', d ? 'dark' : 'light'); };
const bt = document.getElementById('back-top');
window.addEventListener('scroll', () => bt.classList.toggle('show', window.scrollY > 300));
bt.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
</script>

<script>
const ITEMS = [
  ['show_platform','交易平台','对外展示交易平台'],['show_shop','店铺名称','对外展示店铺名称'],
  ['show_item','购买物品','对外展示购买物品'],['show_amount','物品金额','对外展示物品金额'],
  ['show_buyer_account','买家账号','对外展示买家账号'],['show_buyer_name','买家姓名','对外展示买家姓名'],
  ['show_real_phone','买家真实号码','敏感，建议关闭'],['show_virtual_phone','买家虚拟号码','敏感，建议关闭'],
  ['show_address','买家地址','敏感，建议关闭'],['show_tracking','快递单号','对外展示快递单号'],
  ['show_refund_count','仅退款次数','对外展示仅退款次数'],['show_refund_amount','仅退款金额','对外展示仅退款金额'],
];
function renderNav() {
  const u = Api.user;
  if (u) {
    document.getElementById('nav-user').textContent = u.name || u.phone;
    document.getElementById('nav-logout').style.display = '';
    if (u.role === 'admin') document.getElementById('nav-admin').style.display = '';
  }
}
document.getElementById('nav-logout').onclick = (e) => { e.preventDefault(); Api.logout(); location.href = 'login.html'; };

async function load() {
  const { settings } = await Api.settings();
  document.getElementById('switches').innerHTML = ITEMS.map(([k, lab, desc]) => `
    <div class="switch-row">
      <div><div class="switch-label">${lab}</div><div class="switch-desc">${desc}</div></div>
      <label class="switch"><input type="checkbox" id="sw-${k}" ${settings[k] === 1 || settings[k] === undefined ? 'checked' : ''}><span class="slider"></span></label>
    </div>`).join('');
}

document.getElementById('btn-save').onclick = async () => {
  const s = {};
  for (const [k] of ITEMS) s[k] = document.getElementById('sw-' + k).checked ? 1 : 0;
  try {
    await Api.saveSettings(s);
    document.getElementById('saved').textContent = '已保存';
    setTimeout(() => document.getElementById('saved').textContent = '', 2000);
  } catch (e) { toast(e.message, false); }
};

// 修改密码
document.getElementById('btn-change-password').onclick = async () => {
  const oldp = document.getElementById('old-password').value;
  const newp = document.getElementById('new-password').value;
  const confp = document.getElementById('confirm-password').value;
  const msg = document.getElementById('pwd-msg');
  if (!oldp) { msg.textContent = '请输入当前密码'; msg.style.color = '#dc2626'; return; }
  if (newp.length < 6) { msg.textContent = '新密码至少 6 位'; msg.style.color = '#dc2626'; return; }
  if (newp !== confp) { msg.textContent = '两次输入的新密码不一致'; msg.style.color = '#dc2626'; return; }
  try {
    await Api.changePassword(oldp, newp);
    msg.textContent = '密码已修改'; msg.style.color = '#16a34a';
    document.getElementById('old-password').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('confirm-password').value = '';
    setTimeout(() => msg.textContent = '', 3000);
  } catch (e) { msg.textContent = e.message; msg.style.color = '#dc2626'; }
};

renderNav();
load().catch((e) => { if (e.message.includes('未登录')) location.href = 'login.html'; else toast(e.message, false); });
</script>
</body>
</html>
